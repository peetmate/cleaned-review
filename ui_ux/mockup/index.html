/* ---- js/72_numbering.js ---- */
/* Automatic numbering.
   Step numbers come from the position of a section among the wizard sections in schema.json,
   so inserting or reordering a section renumbers everything after it with no hand-editing.
   Numbers are stable across participants: a step hidden by their answers keeps its number. */
(function (ICL) {
  const D = ICL.dict;
  let cache = null;

  function stepNumbers() {
    if (cache) return cache;
    const map = {}; let n = 0;
    for (const sec of D.sections()) if (sec.wizard) map[sec.id] = ++n;
    cache = { map, total: n };
    return cache;
  }
  const stepOf = (sectionId) => stepNumbers().map[sectionId] || null;
  const totalSteps = () => stepNumbers().total;
  /** "3" for a wizard step, "" for reference screens (Home, Parameters, Results, Feedback). */
  const prefix = (sectionId) => { const n = stepOf(sectionId); return n ? String(n) : ""; };

  /** Number the headings inside a rendered screen in DOM order: h2 → N.1, h3/legend → N.1.1.
      Runs after every render, so adding or removing a heading renumbers the rest. */
  function numberHeadings(root, sectionId) {
    const step = stepOf(sectionId); if (!step) return;
    let h2 = 0, h3 = 0;
    const nodes = root.querySelectorAll("h2, h3, legend");
    for (const el of nodes) {
      if (el.closest("[data-no-number]")) continue;
      const tag = el.tagName.toLowerCase();
      let num;
      if (tag === "h2") { h2++; h3 = 0; num = `${step}.${h2}`; }
      else { if (!h2) { h2++; } h3++; num = `${step}.${h2}.${h3}`; }
      if (el.querySelector(".num")) { el.querySelector(".num").textContent = num; continue; }
      el.prepend(ICL.h("span", { class: "num", "aria-hidden": "true" }, num), " ");
      el.dataset.num = num;
      const box = el.closest("[data-fb]"); if (box && !box.dataset.fbNum) box.dataset.fbNum = num;
    }
  }

  /** The number a feedback comment should quote: the nearest numbered heading above the element. */
  function numberFor(el) {
    const withNum = el.closest("[data-num], [data-fb-num]");
    if (withNum) return withNum.dataset.num || withNum.dataset.fbNum;
    const screen = document.getElementById("screen");
    if (!screen || !screen.contains(el)) return "";
    // walk backwards through numbered headings
    const heads = [...screen.querySelectorAll("[data-num]")];
    let last = "";
    for (const hEl of heads) { if (hEl.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) last = hEl.dataset.num; }
    return last || prefix(ICL.store.get().route.screen);
  }

  ICL.num = { stepOf, totalSteps, prefix, numberHeadings, numberFor, invalidate: () => (cache = null) };
})(window.ICL);

  const emptyText = (c, s) => ({ plots: `Add the first ${ICL.dict.words().plot} that grows feed or is grazed.`, seasons: "Add the first feeding period, or pick a template below.", herds: "Add a herd: animals kept together and managed the same way. One herd is enough for most enterprises.", animals: "Add the first group of animals, for example the milking cows.", feeds: "Add the first feed the animals eat, for example the grass they graze or are cut." }[c]);

  /** How many herds an enterprise may have, and what the model actually receives. */
  function herdsExplainer(state) {
    const dup = {};
    for (const a of state.animals) { const d = D.decorate(a, "animal", state); if (!d._desc) continue; (dup[d._desc] = dup[d._desc] || []).push(a); }
    const shared = Object.entries(dup).filter(([, list]) => new Set(list.map((a) => a.herd_ref)).size > 1);
    const box = h("div", { class: "callout", dataset: { fb: "herds:explainer", fbLabel: "What a herd is", noNumber: "" } },
      h("strong", null, "As many herds as you keep. "),
      ICL.t("A herd is animals kept together and managed the same way \u2014 one shed, one grazing pattern, one way of handling dung. Most {enterprise}s have one; separate the young stock, a second site or a zero-grazing unit into their own herd when they are managed differently. Herds are how you describe and check the enterprise; the model itself receives one row per animal type."),
      h("div", { class: "small", style: "margin-top:6px" },
        "That last point matters, and it is a limit of the model rather than of this screen: the model keeps ",
        h("strong", null, "one row per animal type"), ", so if the same type appears in two herds their hours, manure handling and diet are merged by head count before it is sent, and the merge is listed on ",
        h("a", { href: "#check" }, "Check & run"), ". Sending the two rows unmerged makes the model stop with an error, so merging is not a choice we have. ",
        "To keep two groups apart in the results, give them different animal types, or describe them as two scenarios and compare."));
    if (shared.length) box.append(h("div", { class: "small", style: "margin-top:6px" },
      h("span", { class: "chip", style: "color:var(--warn);border-color:var(--warn)" }, "merging"), " ",
      shared.map(([desc, list]) => `${D.livetypeLabel(desc)} is in ${new Set(list.map((a) => a.herd_ref)).size} herds (${list.map((a) => ICL.fmt(a.herd_n || 0, 0)).join(" + ")} head)`).join(" \u00b7 "), "."));
    return box;
  }

  // ---- record tabs -------------------------------------------------------------
  /** One tab per record, so moving between feeds or animals happens on the page
      rather than in the sidebar, which has to stay a map of the steps. */
  function recordTabs(collection, list, state, val, currentId) {
    const wrap = h("div", { class: "rec-tabs", role: "tablist", "aria-label": ICL.common.entityNoun(collection) + " list", dataset: { fb: "tabs:" + collection, fbLabel: "Record tabs: " + collection, noNumber: "" } });
    const num = ICL.num.prefix(collection);
    list.forEach((e, i) => {
      const errs = val.errors.filter((x) => x.screen === collection && x.entityId === e.id).length;
      wrap.append(h("a", { class: "rec-tab" + (e.id === currentId ? " on" : ""), role: "tab", "aria-selected": String(e.id === currentId), href: ICL.router.hashFor(collection, e.id) },
        num ? h("span", { class: "num" }, `${num}.${i + 1}`) : null,
        h("span", null, ICL.layout.entityLabel(collection, e, state)),
        errs ? h("span", { class: "badge" }, String(errs)) : null));
    });
    wrap.append(h("a", { class: "rec-tab add", href: ICL.router.hashFor(collection, "new") }, "+ Add"));
    if (currentId) wrap.append(h("a", { class: "rec-tab", href: ICL.router.hashFor(collection) }, "All " + (list.length > 1 ? ICL.common.entityNoun(collection) + "s" : ICL.common.entityNoun(collection))));
    return wrap;
  }
  /** Previous / next within the collection, for keyboard and for long lists. */
  function recordNav(collection, list, selected) {
    const i = list.findIndex((e) => e.id === selected.id);
    const prev = list[i - 1], next = list[i + 1];
    return h("div", { class: "control", style: "margin-top:10px" },
      prev ? h("a", { class: "btn-sm", href: ICL.router.hashFor(collection, prev.id) }, "\u2190 " + ICL.layout.entityLabel(collection, prev, ICL.store.get())) : null,
      h("span", { class: "small" }, `${i + 1} of ${list.length}`),
      next ? h("a", { class: "btn-sm", href: ICL.router.hashFor(collection, next.id) }, ICL.layout.entityLabel(collection, next, ICL.store.get()) + " \u2192") : null);
  }

  // ---- filtering and compact lists ---------------------------------------------
  const FILTERABLE = { feeds: true, animals: true, plots: true };
  const COMPACT_AT = 8;
  const setFilter = (collection, next) => ICL.store.set((s) => { s.ui.listFilter = Object.assign({}, s.ui.listFilter, { [collection]: next }); return s; });
  const compactMode = (collection, list, state) => {
    const pref = (state.ui.listView || {})[collection];
    if (pref) return pref === "list";
    return FILTERABLE[collection] && list.length > COMPACT_AT;
  };

  function searchText(collection, e, state) {
    const d = D.decorate(e, TYPE[collection], state);
    if (collection === "feeds") {
      const syn = (D.tables().feedSynonyms || {})[e.feed_item] || [];
      return [d._feedItem ? D.displayFeedName(d._feedItem.feed_item_name) : "", d._crop ? d._crop.crop_name : "", ...syn, e.feed_origin || "", e.feed_part || ""].join(" ").toLowerCase();
    }
    if (collection === "animals") return [e.group_name || "", d._desc || "", D.livetypeLabel(d._desc) || ""].join(" ").toLowerCase();
    return [e.plot_name || "", e.plot_use || "", e.land_cover || ""].join(" ").toLowerCase();
  }

  /** Chip definitions per collection: {value, label, test}. Built from the data, so a chip only appears when it matches something. */
  function chipsFor(collection, list, state) {
    const out = [{ value: "all", label: "All", test: () => true }];
    if (collection === "feeds") {
      const W = ICL.dict.words();
      for (const [v, l] of [["grown", "Grown here"], ["bought", "Bought"], ["collected", ICL.t("Collected {offfarm}")]])
        if (list.some((e) => e.feed_origin === v)) out.push({ value: "origin:" + v, label: l, test: (e) => e.feed_origin === v });
      if (list.some((e) => e.feed_part === "residue")) out.push({ value: "part:main", label: "Main product", test: (e) => (e.feed_part || "main") === "main" });
      if (list.some((e) => e.feed_part === "residue")) out.push({ value: "part:residue", label: "Residues", test: (e) => e.feed_part === "residue" });
      for (const p of state.plots) if (list.some((e) => e.feed_plot === p.id))
        out.push({ value: "plot:" + p.id, label: p.plot_name || W.plot, test: (e) => e.feed_plot === p.id });
    }
    if (collection === "animals") {
      for (const hd of state.herds) if (list.some((e) => e.herd_ref === hd.id))
        out.push({ value: "herd:" + hd.id, label: hd.herd_name || "Herd", test: (e) => e.herd_ref === hd.id });
      if (list.some((e) => D.decorate(e, "animal", state)._milking)) out.push({ value: "milking", label: "Milking", test: (e) => D.decorate(e, "animal", state)._milking });
      if (list.some((e) => D.decorate(e, "animal", state)._young)) out.push({ value: "young", label: "Young stock", test: (e) => D.decorate(e, "animal", state)._young });
    }
    if (collection === "plots") {
      for (const [v, l] of [["crops", "Feed or crops"], ["grazing", "Grazing"], ["both", "Crops and grazing"]])
        if (list.some((e) => e.plot_use === v)) out.push({ value: "use:" + v, label: l, test: (e) => e.plot_use === v });
    }
    return out;
  }

  function filterList(collection, list, state, val, flt) {
    const chip = chipsFor(collection, list, state).find((c) => c.value === flt.tag) || { test: () => true };
    const q = (flt.q || "").trim().toLowerCase();
    return list.filter((e) => {
      if (flt.tag === "attention") return val.errors.some((x) => x.screen === collection && x.entityId === e.id);
      if (!chip.test(e)) return false;
      return !q || searchText(collection, e, state).includes(q);
    });
  }

  function filterBar(collection, list, shown, state, val, flt) {
    const chips = chipsFor(collection, list, state);
    const attention = list.filter((e) => val.errors.some((x) => x.screen === collection && x.entityId === e.id)).length;
    const wrap = h("div", { class: "listfilter", dataset: { fb: "filter:" + collection, fbLabel: "Filter " + collection, noNumber: "" } });
    const row = h("div", { class: "chips", role: "group", "aria-label": "Filter" });
    for (const c of chips) {
      const n = c.value === "all" ? list.length : list.filter(c.test).length;
      row.append(h("button", { type: "button", class: "filterchip", "aria-pressed": String(flt.tag === c.value), onclick: () => setFilter(collection, Object.assign({}, flt, { tag: c.value })) }, c.label, h("span", { class: "cnt" }, String(n))));
    }
    if (attention) row.append(h("button", { type: "button", class: "filterchip bad", "aria-pressed": String(flt.tag === "attention"), onclick: () => setFilter(collection, Object.assign({}, flt, { tag: "attention" })) }, "Needs attention", h("span", { class: "cnt" }, String(attention))));
    const search = h("input", { type: "search", value: flt.q || "", placeholder: collection === "feeds" ? "Search feeds, crops, local names…" : "Search…", "aria-label": "Search " + collection });
    search.addEventListener("input", () => setFilter(collection, Object.assign({}, flt, { q: search.value })));
    const compact = compactMode(collection, list, state);
    const viewBtn = h("button", { type: "button", class: "btn-sm", onclick: () => ICL.store.set((s) => { s.ui.listView = Object.assign({}, s.ui.listView, { [collection]: compact ? "cards" : "list" }); return s; }) }, compact ? "Show as cards" : "Show as a list");
    wrap.append(row, h("div", { class: "control" }, search, viewBtn,
      h("span", { class: "small" }, shown.length === list.length ? `${list.length} in total` : `${shown.length} of ${list.length} shown`)));
    return wrap;
  }

  function compactList(collection, shown, state, val) {
    const cols = collection === "feeds" ? ["Feed", "From", "Part", "Fed"] : collection === "animals" ? ["Group", "Herd", "Head", "Day (h)"] : ["Plot", "Area", "Use", "Grows"];
    const t = h("table", { class: "grid" }, h("thead", null, h("tr", null, ...cols.map((c) => h("th", null, c)), h("th", null, ""))));
    const tb = h("tbody");
    for (const e of shown) {
      const d = D.decorate(e, TYPE[collection], state);
      const errs = val.errors.filter((x) => x.screen === collection && x.entityId === e.id).length;
      const cells = collection === "feeds"
        ? [h("td", null, d._feedItem ? D.displayFeedName(d._feedItem.feed_item_name) : "New feed", errs ? h("span", { class: "chip", style: "margin-left:6px;color:var(--danger);border-color:var(--danger)" }, `${errs} to fix`) : null),
           h("td", null, { grown: (state.plots.find((p) => p.id === e.feed_plot) || {}).plot_name || "grown here", bought: "bought", collected: ICL.t("collected {offfarm}") }[e.feed_origin] || "—"),
           h("td", null, e.feed_part === "residue" ? "residue" : "main"),
           h("td", null, e.feed_origin === "grown" ? (e.main_fed_share != null ? e.main_fed_share + "%" : "—") : "—")]
        : collection === "animals"
          ? [h("td", null, D.livetypeLabel(d._desc), errs ? h("span", { class: "chip", style: "margin-left:6px;color:var(--danger);border-color:var(--danger)" }, `${errs} to fix`) : null),
             h("td", null, (state.herds.find((x) => x.id === e.herd_ref) || {}).herd_name || "—"),
             h("td", null, e.herd_n != null ? ICL.fmt(e.herd_n, 0) : "—"),
             h("td", null, `${d.hours_stable || 0}/${d.hours_pen || 0}/${d.hours_onfarm || 0}/${d.hours_offfarm || 0}`)]
          : [h("td", null, e.plot_name || "New plot", errs ? h("span", { class: "chip", style: "margin-left:6px;color:var(--danger);border-color:var(--danger)" }, `${errs} to fix`) : null),
             h("td", null, e.plot_area_ha != null ? ICL.fmt(e.plot_area_ha, 2) + " ha" : "—"),
             h("td", null, { crops: "Feed or crops", grazing: "Grazing", both: "Crops and grazing" }[e.plot_use] || "—"),
             h("td", null, state.feeds.filter((f) => f.feed_plot === e.id).length + " feeds")];
      tb.append(h("tr", null, ...cells, h("td", null, h("a", { class: "btn-sm", href: ICL.router.hashFor(collection, e.id) }, "Edit"))));
    }
    t.append(tb);
    return h("div", { class: "tablewrap card", dataset: { fb: collection + ":list", fbLabel: ICL.common.entityNoun(collection) + " list" } }, t);
  }

  function card(collection, e, state, val, expanded) {
    const etype = TYPE[collection]; const dec = D.decorate(e, etype, state);
    const errs = val.errors.filter((x) => x.screen === collection && x.entityId === e.id);
    const title = ICL.layout.entityLabel(collection, e, state);
    const head = h("div", { class: "card-head" }, h("h2", null, title, errs.length ? h("span", { class: "chip", style: "margin-left:8px;color:var(--danger);border-color:var(--danger)" }, `${errs.length} to fix`) : null),
      h("div", { class: "actions" }, expanded ? h("a", { class: "btn-sm", href: ICL.router.hashFor(collection) }, "Done") : h("a", { class: "btn-sm", href: ICL.router.hashFor(collection, e.id) }, "Edit"), confirmButton("Remove", () => { removeEntity(collection, e.id); ICL.toast(`Removed "${title}".`); ICL.router.go(collection); }, "btn-sm")));
    const wrap = h("div", { class: "card", dataset: { fb: `${etype}:${e.id}`, fbLabel: `${etype} card: ${title}` } }, head);
    if (!expanded) { wrap.append(summary(collection, dec, state)); return wrap; }
    const ctx = entityCtx(state, val, collection, e, etype);
    const touched = Object.keys(state.provenance).some((p) => p.startsWith(`${collection}[${e.id}]`)) || state.ui.validateAll;
    if (!touched) { ctx.errors = []; ctx.warnings = []; wrap.append(h("p", { class: "small" }, "Fill in what you know; we will point out anything missing on Check & run.")); }
    if (collection === "animals") wrap.append(animalCard(dec, ctx, state));
    else if (collection === "herds") wrap.append(herdCard(dec, ctx, state, val));
    else if (collection === "feeds") wrap.append(feedCard(dec, ctx, state));
    else if (collection === "seasons") wrap.append(seasonCard(dec, ctx, state));
    else wrap.append(ICL.fields.renderFields(collection, ctx));
    return wrap;
  }

  function summary(collection, e, state) {
    const dl = h("dl", { class: "kv" }); const add = (k, v) => { if (v != null && v !== "") dl.append(h("dt", null, k), h("dd", null, v)); };
    if (collection === "plots") { add("Area", e.plot_area_ha ? ICL.fmt(e.plot_area_ha, 2) + " ha" : "not given"); add("Use", { crops: "Feed or crops", grazing: "Grazing", both: "Crops and grazing" }[e.plot_use]); add("Slope", e.slope_class ? e.slope_class.split(" (")[0] : null); add("Grown here", state.feeds.filter((f) => f.feed_plot === e.id).map((f) => { const d = D.decorate(f, "feed", state); return d._feedItem ? D.displayFeedName(d._feedItem.feed_item_name) : "?"; }).join(", ") || "nothing yet"); }
    if (collection === "seasons") { const m = e.season_months || []; add("Months", m.length ? m.map((x) => ICL.MONTHS[x - 1]).join(" ") : "none"); add("Days", m.reduce((d, x) => d + ICL.MONTH_DAYS[x - 1], 0)); }
    if (collection === "herds") { const p = window.ICL_SCHEMA.herdPatterns.find((x) => x.value === e.herd_pattern); add("Pattern", p ? ICL.t(p.label) : "not set"); add("Groups", state.animals.filter((a) => a.herd_ref === e.id).length); add("Animals", ICL.fmt(state.animals.filter((a) => a.herd_ref === e.id).reduce((t, a) => t + (Number(a.herd_n) || 0), 0), 0)); }
    if (collection === "animals") { add("Herd", (state.herds.find((x) => x.id === e.herd_ref) || {}).herd_name); const milk = D.effective(D.field("milk_l_day"), e, state).value; if (e._milking && milk != null) add("Milk", `${milk} L/day`); if (e._young) add("Growth", (e.growth_kg_yr ?? "?") + " kg/yr"); const W = ICL.dict.words(); add("Day", `${e.hours_stable || 0} h shed · ${e.hours_pen || 0} h pen · ${e.hours_onfarm || 0} h ${W.onfarm} · ${e.hours_offfarm || 0} h ${W.offfarm}`); }
    if (collection === "feeds") { add("From", { grown: `grown on ${ICL.dict.words().plot} ` + ((state.plots.find((p) => p.id === e.feed_plot) || {}).plot_name || "?"), bought: "bought", collected: ICL.t("collected {offfarm}") }[e.feed_origin] || "not set"); if (e.feed_origin === "grown") add("Part fed", e.feed_part === "residue" ? "residue" : "main product"); if (e._feedItem) add("Quality", `DM ${e._feedItem.dm_content}% · ME ${e._feedItem.me_content} MJ/kg · CP ${e._feedItem.cp_content}%`); }
    return dl;
  }

  // ---- add flows -------------------------------------------------------------
  function addFlow(collection, state) {
    const etype = TYPE[collection];
    const box = h("div", { class: "card", dataset: { fb: `add:${etype}`, fbLabel: `Add ${etype}` } }, h("h2", null, "Add " + etype));
    if (collection === "animals") {
      if (!state.herds.length) { box.append(h("p", null, "First add a herd, so we know where these animals live."), h("a", { class: "btn", href: "#herds-new" }, "Add a herd")); return box; }
      box.append(h("p", { class: "small" }, "Pick the species, then the group. The description tells you which group fits."));
      box.append(groupPicker(state, null));
      return box;
    }
    if (collection === "feeds") {
      const search = h("input", { type: "text", placeholder: "Search feeds…", "aria-label": "Search feeds" });
      const listBox = h("div", { class: "pickerlist" });
      const syn = D.tables().feedSynonyms || {};
      const render = () => { listBox.innerHTML = ""; const q = search.value.toLowerCase().trim(); const items = D.vocab().feeditems.filter((fi) => D.displayFeedName(fi.feed_item_name).toLowerCase().includes(q) || (syn[fi.feed_item_code] || []).some((x) => x.toLowerCase().includes(q))); const byCat = {}; for (const fi of items) { const crop = D.cropOf(fi.crop_code); const cat = crop ? crop.category : "other"; (byCat[cat] = byCat[cat] || []).push(fi); }
        for (const [cat, fis] of Object.entries(byCat)) { listBox.append(h("div", { class: "grp" }, { grass: "Grasses & fodder", legume: "Legumes", cereal: "Cereals & residues", "tree crop": "Tree crops" }[cat] || cat)); for (const fi of fis) listBox.append(h("button", { type: "button", title: (syn[fi.feed_item_code] || []).join(", "), onclick: () => { const id = addEntity("feeds", { feed_item: fi.feed_item_code, feed_origin: state.system.growsFeed ? "grown" : "bought", feed_plot: state.plots[0] ? state.plots[0].id : null }); ICL.store.set((s) => { s.provenance[`feeds[${id}].feed_origin`] = "default"; if (state.plots[0]) s.provenance[`feeds[${id}].feed_plot`] = "default"; return s; }); ICL.router.go("feeds", id); } }, h("strong", null, (syn[fi.feed_item_code] || [])[0] ? `${syn[fi.feed_item_code][0]} · ` : "", D.displayFeedName(fi.feed_item_name)), h("span", { class: "small" }, `DM ${fi.dm_content}% · ME ${fi.me_content} · CP ${fi.cp_content}%`))); }
        if (!items.length) listBox.append(h("div", { class: "grp" }, "Nothing matches. In the real app you could request a feed to be added to the parameter set.")); };
      search.addEventListener("input", render); render();
      box.append(h("p", { class: "small" }, `Feeds come from the parameter set "${state.meta.param_set}". `, h("a", { href: "#parameters" }, "See the full list")), search, listBox);
      return box;
    }
    // plots, seasons, herds: create immediately and open the card
    const seed = collection === "herds" ? { herd_pattern: "night_shed" } : collection === "seasons" ? { season_months: [] } : { plot_use: "crops" };
    const id = addEntity(collection, seed); setTimeout(() => ICL.router.go(collection, id), 0);
    return box;
  }

  // ---- specialised cards --------------------------------------------------------
  /** Species chips + group list. `herdId` null = ask which herd; otherwise add straight into that herd. */
  function groupPicker(state, herdId) {
    const frag = document.createDocumentFragment();
    const species = [...new Set(D.vocab().livetype.map((l) => l.species))].filter((sp) => (state.system.species || ["Cattle"]).includes(sp) || sp === "Cattle");
    let sp = species[0];
    const groupsBox = h("div", { class: "pickerlist" });
    const herdSel = herdId ? null : h("select", { "aria-label": "Herd" }, ...state.herds.map((hd) => h("option", { value: hd.id }, hd.herd_name || "Herd")));
    const renderGroups = () => {
      groupsBox.innerHTML = "";
      for (const lt of D.vocab().livetype.filter((l) => l.species === sp)) {
        const lab = D.tables().livetypeLabels[lt.desc] || { label: lt.desc.split(" - ")[1] };
        groupsBox.append(h("button", { type: "button", onclick: () => { const id = addEntity("animals", { livetype: lt.code, herd_ref: herdId || herdSel.value }); ICL.router.go("animals", id); } },
          h("strong", null, lab.label), h("span", { class: "small" }, `\u2248 ${lt.body_weight} kg \u00b7 `, lab.definition || "")));
      }
    };
    const chips = h("div", { class: "chips" });
    for (const one of species) { const r = h("input", { type: "radio", name: "sp" + (herdId || "") }); r.checked = one === sp; r.addEventListener("change", () => { sp = one; renderGroups(); }); chips.append(h("label", null, r, one)); }
    renderGroups();
    if (herdSel) frag.append(h("div", { class: "field" }, h("div", { class: "field-label" }, "Herd"), herdSel));
    frag.append(h("div", { class: "field" }, h("div", { class: "field-label" }, "Species"), chips),
      h("div", { class: "field" }, h("div", { class: "field-label" }, "Group"), groupsBox));
    return frag;
  }

  /** Herd card: the herd's own answers, its manure handling, and the animal groups inside it. */
  function herdCard(e, ctx, state, val) {
    const frag = document.createDocumentFragment();
    frag.append(ICL.fields.renderFields("herds", ctx, (f) => f.group !== "Manure in this herd"));
    const groups = state.animals.filter((a) => a.herd_ref === e.id);
    const head = groups.reduce((t, a) => t + (Number(a.herd_n) || 0), 0);
    const fs = h("fieldset", { dataset: { fb: `herd:groups:${e.id}`, fbLabel: "Animal groups in this herd" } },
      h("legend", null, "Animal groups in this herd"),
      h("p", { class: "small" }, "A group is one category of animal \u2014 milking cows, heifers, calves \u2014 because each eats and produces differently. Numbers, weights, milk and the day are on the group."));
    if (!groups.length) fs.append(h("div", { class: "empty" }, "No groups yet. Add the first one, for example the milking cows."));
    else {
      const tbl = h("table", { class: "grid" }, h("thead", null, h("tr", null, h("th", null, "Group"), h("th", null, "Head"), h("th", null, "A normal day (h)"), h("th", null, ""))));
      const tb = h("tbody");
      for (const a of groups) {
        const d = D.decorate(a, "animal", state);

    for (const r of (sheets.herds || []).filter((r) => r.enterprise_id === id)) {
      const pat = PATTERNS[String(r.pattern || "").trim().toLowerCase()] || null;
      if (r.pattern && !pat) say("warning", "herds.pattern", `herd "${r.herd_name}" pattern "${r.pattern}" not recognised; the hours from the animal rows are used`);
      const mk = (word, pct, fallback) => {
        const hv = MANURE_WORDS[String(word || "").trim().toLowerCase()];
        if (word && !hv) say("warning", "herds.manure", `herd "${r.herd_name}": manure handling "${word}" not recognised; "${fallback}" assumed`);
        const p = num(pct);
        return { handling: hv || fallback, collected: Number.isNaN(p) || p == null ? (hv === "left" ? 0 : 100) : p, followups: {} };
      };
      const kept = num(r.kept_on_farm_pct);
      const hd = { id: "h" + (Object.keys(herdByName).length + 1), herd_name: r.herd_name, herd_pattern: pat, herd_plots: [], hmanure_stable: mk(r.manure_shed, r.collected_shed_pct, "piled"), hmanure_pen: mk(r.manure_pen, r.collected_pen_pct, "drylot"), hmanure_onfarm: { handling: "left", collected: 0, followups: {} }, hmanure_offfarm: { handling: "left", collected: 0, followups: {} }, hmanure_kept_share: Number.isNaN(kept) || kept == null ? 100 : kept };
      herdByName[r.herd_name] = hd; st.herds.push(hd);
    }
    if (!st.herds.length) { const hd = { id: "h1", herd_name: "Herd", herd_pattern: null, herd_plots: [], hmanure_stable: { handling: "piled", collected: 100, followups: {} }, hmanure_pen: { handling: "drylot", collected: 80, followups: {} }, hmanure_onfarm: { handling: "left", collected: 0, followups: {} }, hmanure_offfarm: { handling: "left", collected: 0, followups: {} }, hmanure_kept_share: 100 }; herdByName["Herd"] = hd; st.herds.push(hd); }
    // animals
    const animalKey = {};
    for (const r of (sheets.animals || []).filter((r) => r.enterprise_id === id)) {
      const lt = findLivetype(r.group);
      if (!lt) { say("error", "animals.group", `"${r.group}" is not an animal group in this parameter set`); continue; }
      const hd = herdByName[r.herd_name] || st.herds[0];
      if (r.herd_name && !herdByName[r.herd_name]) say("warning", "animals.herd_name", `herd "${r.herd_name}" has no row in the herds sheet; "${hd.herd_name}" used`);
      const head = num(r.head);
      if (Number.isNaN(head) || head == null) say("error", "animals.head", `"${r.group}": head count "${r.head}" is not a number`);
      const hrs = ["hours_shed", "hours_pen", "hours_grazing_onfarm", "hours_grazing_offfarm"].map((k) => { const v = num(r[k]); return Number.isNaN(v) || v == null ? null : v; });
      const a = {
        id: "a" + (st.animals.length + 1), herd_ref: hd.id, livetype: String(lt.code), group_name: r.group_name || null,
        herd_n: Number.isNaN(head) ? null : head, body_weight: num(r.body_weight_kg) || null, adult_weight: null,
        milk_l_day: num(r.milk_l_day) || null, lactation_days: num(r.lactation_days) || null, growth_kg_yr: num(r.growth_kg_yr) || null,
        hours_stable: hrs[0], hours_pen: hrs[1], hours_onfarm: hrs[2], hours_offfarm: hrs[3],
        manure_stable: null, manure_pen: null, manure_onfarm: null, manure_offfarm: null, manure_kept_share: null,
      };
      if (hrs.every((x) => x != null)) { const t = hrs.reduce((s, x) => s + x, 0); if (Math.abs(t - 24) > 0.01) say("error", "animals.hours_*", `"${r.group}": the day adds up to ${fmt(t)} hours, not 24`); }
      if (a.milk_l_day != null) st.system.aim = st.system.aim === "meat" ? "both" : (st.system.aim || "milk");
      if (a.growth_kg_yr != null && st.system.aim === "milk") st.system.aim = "both";
      st.animals.push(a); animalKey[`${r.herd_name || hd.herd_name}||${r.group}`] = a; animalKey[r.group] = animalKey[r.group] || a;
    }
    if (!st.animals.length) say("error", "animals", "no animal rows for this enterprise");
    if (!st.system.aim) st.system.aim = "milk";
    // feeds
    const feedByName = {};
    for (const r of (sheets.feeds || []).filter((r) => r.enterprise_id === id)) {
      const fi = findFeed(r.feed);
      if (!fi) { say("error", "feeds.feed", `"${r.feed}" is not a feed in this parameter set`); continue; }
      const origin = ["grown", "bought", "collected"].includes(String(r.origin || "").toLowerCase()) ? String(r.origin).toLowerCase() : null;
      if (!origin) say("error", "feeds.origin", `"${r.feed}": origin must be grown, bought or collected (found "${r.origin}")`);
      const plot = st.plots.find((p) => p.plot_name === r.plot_name) || (origin === "grown" ? st.plots[0] : null);
      if (origin === "grown" && r.plot_name && !st.plots.find((p) => p.plot_name === r.plot_name)) say("warning", "feeds.plot_name", `"${r.feed}": plot "${r.plot_name}" has no row in the plots sheet`);
      const fd = {
        id: "f" + (st.feeds.length + 1), feed_item: String(fi.feed_item_code), feed_origin: origin || "bought",
        feed_part: (r.part || "").toLowerCase() === "residue" ? "residue" : "main",
        feed_plot: plot ? plot.id : null, yield_t_dm_ha: num(r.yield_t_dm_ha) || null,
        main_fed_share: num(r.main_fed_share_pct) || null, manure_to_plot_share: num(r.manure_to_plot_pct) || null,
      };
      if (fd.feed_part === "residue" && origin === "grown") {
        const parts = { fed: num(r.residue_fed_pct), left: num(r.residue_left_pct), burnt: num(r.residue_burnt_pct) };
        const given = Object.values(parts).filter((x) => x != null && !Number.isNaN(x));
        if (!given.length) say("error", "feeds.residue_*_pct", `"${r.feed}" is a residue, so the model needs what happens to it: residue_fed_pct, residue_left_pct and residue_burnt_pct, adding to 100`);
        else {
          const v = { fed: parts.fed || 0, left: parts.left || 0, burnt: parts.burnt || 0 };
          const tot = v.fed + v.left + v.burnt;
          if (Math.abs(tot - 100) > 0.5) say("error", "feeds.residue_*_pct", `"${r.feed}": the residue shares add up to ${fmt(tot)}%, not 100`);
          fd.residue_fate = v;
        }
      }
      if (origin === "bought") st.system.buysFeed = true;
      st.feeds.push(fd); feedByName[String(r.feed).trim().toLowerCase()] = fd;
    }
    if (!st.feeds.length) say("error", "feeds", "no feed rows for this enterprise");
    // diet
    for (const r of (sheets.diet || []).filter((r) => r.enterprise_id === id)) {
      const season = st.seasons.find((s) => s.season_name === r.season_name) || st.seasons[0];
      if (r.season_name && !st.seasons.find((s) => s.season_name === r.season_name)) say("warning", "diet.season_name", `season "${r.season_name}" has no row in the seasons sheet; "${season.season_name}" used`);
      const a = animalKey[`${r.herd_name || ""}||${r.group}`] || animalKey[r.group];
      if (!a) { say("error", "diet.group", `diet given for "${r.group}", which has no animal row`); continue; }
      const fd = feedByName[String(r.feed).trim().toLowerCase()];
      if (!fd) { say("error", "diet.feed", `diet given for feed "${r.feed}", which has no feed row`); continue; }
      const share = num(r.share_pct);
      if (Number.isNaN(share) || share == null) { say("error", "diet.share_pct", `"${r.group}" / "${r.feed}": share "${r.share_pct}" is not a number`); continue; }
      st.allocation[season.id] = st.allocation[season.id] || {};
      st.allocation[season.id][a.id] = st.allocation[season.id][a.id] || {};
      st.allocation[season.id][a.id][fd.id] = share;
    }
    return st;
  }

  /** Full state object the validator and compiler expect (they read ui/route/library too). */
  function asState(data) {
    const live = ICL.store.get();
    return Object.assign({}, live, data, { route: { screen: "batch", entity: null }, ui: Object.assign({}, live.ui, { validateAll: true }) });
  }

  function checkRows(sheets) {
    const ids = [...new Set((sheets.enterprises || []).map((r) => r.enterprise_id).concat(
      ["seasons", "plots", "herds", "animals", "feeds", "diet"].flatMap((k) => (sheets[k] || []).map((r) => r.enterprise_id))))].filter(Boolean);
    return ids.map((id) => {
      const problems = [];
      const data = buildOne(id, sheets, problems);
      const state = asState(data);
      const val = ICL.validate(state);
      const compiled = ICL.compile(state);
      const errors = problems.filter((p) => p.severity === "error").length + val.errors.length;
      const warnings = problems.filter((p) => p.severity === "warning").length + val.warnings.length;
      const head = data.animals.reduce((t, a) => t + (Number(a.herd_n) || 0), 0);
      const area = data.plots.reduce((t, p) => t + (Number(p.plot_area_ha) || 0), 0);
      const milk = (compiled.input.livestock || []).reduce((t, l) => t + (Number(l.annual_milk) || 0) * (Number(l.herd_composition) || 0), 0);
      return { id, name: data.meta.scenario_name, data, state, val, compiled, problems, errors, warnings, assumptions: val.assumptions.length, head, area, milk, status: errors ? "blocked" : warnings ? "warn" : "ready" };
    });
  }

  // ---- sample batch ------------------------------------------------------------
  /** Sheets built from the example scenarios, jittered, with three rows broken on purpose. */
  function sampleSheets() {
    const out = { enterprises: [], seasons: [], plots: [], herds: [], animals: [], feeds: [], diet: [] };
    const SRC = window.ICL_SCENARIOS.scenarios;
    const labels = D.tables().livetypeLabels || {};
    const bases = ["sc_njombe_baseline", "sc_njombe_napier", "tpl_kenya_zero", "sc_rungwe_commercial"].filter((k) => SRC[k]);
    let n = 0;
    for (const bk of bases) {
      const b = SRC[bk];
      for (let copy = 0; copy < 3; copy++) {
        n++;
        const id = `E${String(n).padStart(3, "0")}`;
        const j = 1 + (copy - 1) * 0.15; // ±15 % so the batch is not twelve identical rows
        const broken = n === 4 ? "hours" : n === 8 ? "diet" : n === 11 ? "feed" : null;
        const L = b.farm.location_point || {};
        out.enterprises.push({ enterprise_id: id, name: `${b.meta.scenario_name} — household ${copy + 1}`, scale: b.system.scale || "farm", country: L.country || "Tanzania", region: L.region || "", district: L.district || "", lat: L.lat ?? "", lon: L.lon ?? "", climate_zone: b.farm.climate_zone_2 || "", annual_prec_mm: b.farm.annual_prec || "", rain_months: (b.farm.rain_months || []).join(","), et0_mm: b.farm.et0 ?? "", soil: b.farm.soil_description || "", soil_c: b.farm.soil_c ?? "", soil_n: b.farm.soil_n ?? "", soil_clay: b.farm.soil_clay ?? "", soil_bulk_g_cm3: b.farm.soil_bulk ?? "", soil_depth_m: b.farm.soil_depth ?? "", purpose: "baseline" });
        for (const s of b.seasons) out.seasons.push({ enterprise_id: id, season_name: s.season_name, months: (s.season_months || []).join(",") });
        for (const p of b.plots) out.plots.push({ enterprise_id: id, plot_name: p.plot_name, area_ha: p.plot_area_ha ? Math.round(p.plot_area_ha * j * 100) / 100 : "", use: p.plot_use, slope_class: p.slope_class, slope_length_m: p.slope_length_m, land_cover: p.land_cover, tillage: p.tillage || "", orgmatter: p.orgmatter || "" });
        for (const hd of b.herds) out.herds.push({ enterprise_id: id, herd_name: hd.herd_name, pattern: hd.herd_pattern || "", manure_shed: (hd.hmanure_stable || {}).handling || "", collected_shed_pct: (hd.hmanure_stable || {}).collected ?? "", manure_pen: (hd.hmanure_pen || {}).handling || "", collected_pen_pct: (hd.hmanure_pen || {}).collected ?? "", kept_on_farm_pct: hd.hmanure_kept_share ?? "" });
        for (const a of b.animals) {
          const lt = D.vocab().livetype.find((l) => String(l.code) === String(a.livetype));
          const hd = b.herds.find((x) => x.id === a.herd_ref) || b.herds[0];
          const hours = [a.hours_stable, a.hours_pen, a.hours_onfarm, a.hours_offfarm];
          if (broken === "hours") hours[2] = (hours[2] || 0) + 3; // day adds up to 27
          out.animals.push({ enterprise_id: id, herd_name: hd ? hd.herd_name : "", group: (labels[lt && lt.desc] || {}).label || (lt ? lt.desc : ""), group_name: a.group_name || "", head: Math.max(1, Math.round((a.herd_n || 1) * j)), body_weight_kg: "", milk_l_day: a.milk_l_day ?? "", lactation_days: a.lactation_days ?? "", growth_kg_yr: a.growth_kg_yr ?? "", hours_shed: hours[0], hours_pen: hours[1], hours_grazing_onfarm: hours[2], hours_grazing_offfarm: hours[3] });
        }
        for (const f of b.feeds) {
          const fi = D.vocab().feeditems.find((x) => String(x.feed_item_code) === String(f.feed_item));
          const plot = b.plots.find((p) => p.id === f.feed_plot);
          const rf = f.residue_fate || {};
          out.feeds.push({ enterprise_id: id, feed: broken === "feed" && f === b.feeds[0] ? "Napier (local variety)" : D.displayFeedName(fi ? fi.feed_item_name : ""), origin: f.feed_origin, part: f.feed_part || "main", plot_name: plot ? plot.plot_name : "", yield_t_dm_ha: f.yield_t_dm_ha ?? "", main_fed_share_pct: f.main_fed_share ?? "", residue_fed_pct: rf.fed ?? "", residue_left_pct: rf.left ?? "", residue_burnt_pct: rf.burnt ?? "", manure_to_plot_pct: f.manure_to_plot_share ?? "" });
        }
        for (const [sid, byAnimal] of Object.entries(b.allocation || {})) {
          const season = b.seasons.find((s) => s.id === sid);
          for (const [aid, byFeed] of Object.entries(byAnimal)) {
            const a = b.animals.find((x) => x.id === aid); const hd = b.herds.find((x) => x.id === (a || {}).herd_ref);
            const lt = D.vocab().livetype.find((l) => String(l.code) === String((a || {}).livetype));
            for (const [fid, share] of Object.entries(byFeed)) {
              const f = b.feeds.find((x) => x.id === fid);
              const fi = D.vocab().feeditems.find((x) => String(x.feed_item_code) === String((f || {}).feed_item));
              let sh = share;
              if (broken === "diet" && f === b.feeds[0]) sh = Math.max(0, Number(share) - 15); // column no longer reaches 100
              out.diet.push({ enterprise_id: id, season_name: season ? season.season_name : "", herd_name: hd ? hd.herd_name : "", group: (labels[lt && lt.desc] || {}).label || (lt ? lt.desc : ""), feed: D.displayFeedName(fi ? fi.feed_item_name : ""), share_pct: sh });
            }
          }
        }
      }
    }
    return out;
  }

  // ---- state helpers -----------------------------------------------------------
  const setBatch = (patch) => ICL.store.set((s) => { s.batch = Object.assign({}, s.batch, patch); return s; });
  function load(sheets, source) {
    const t0 = Date.now();
    const rows = checkRows(sheets);
    setBatch({ sheets, rows, source, loadedAt: new Date().toISOString(), ms: Date.now() - t0, filter: "all", tab: "check" });
    ICL.toast(`${rows.length} enterprise${rows.length === 1 ? "" : "s"} checked in ${Date.now() - t0} ms.`);
  }

  async function readFile(file) {
    const name = (file.name || "").toLowerCase();
    if (name.endsWith(".json")) {
      const obj = JSON.parse(await file.text());
      if (obj && obj.sheets) return { sheets: obj.sheets, source: file.name };
      if (obj && Array.isArray(obj.enterprises)) return { sheets: obj, source: file.name };
      throw new Error("The JSON must be {sheets:{enterprises:[…],…}} or an object with an enterprises array.");
    }
    if (name.endsWith(".csv")) {
      const rows = parseCsv(await file.text());
      const cols = new Set(Object.keys(rows[0] || {}));
      // Score by how completely a sheet's own columns are matched, so animals.csv is not
      // mistaken for herds.csv just because both start with enterprise_id and herd_name.
      const scored = Object.entries(SHEETS).map(([k, spec]) => {
        const req = spec.required.filter((c) => cols.has(c)).length / spec.required.length;
        const known = spec.cols.filter((c) => cols.has(c)).length;
        const extra = [...cols].filter((c) => !spec.cols.includes(c)).length;
        return { k, rows, req, score: known - extra * 2 };
      }).filter((x) => x.req === 1).sort((a, b) => b.score - a.score);
      if (!scored.length) throw new Error("Could not tell which table this CSV is. Its header must match one of the template files — download them above.");
      const key = scored[0].k;
      // One CSV at a time is normal, so a CSV is merged into whatever is already loaded.
      const prev = (ICL.store.get().batch || {}).sheets || {};
      const merged = Object.assign({}, prev, { [key]: rows });
      const have = Object.keys(merged).filter((k) => (merged[k] || []).length);
      return { sheets: merged, source: `${file.name} (read as the ${key} table; loaded so far: ${have.join(", ")})` };
    }
    if (name.endsWith(".xlsx") || name.endsWith(".xls")) {
      const XLSX = await loadXlsx();
      const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
      const sheets = {};
      for (const sn of wb.SheetNames) {
        const key = Object.keys(SHEETS).find((k) => k.toLowerCase() === sn.trim().toLowerCase());
        if (!key) continue;
        sheets[key] = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: "", raw: false }).map((r) => {
          const o = {}; for (const [k, v] of Object.entries(r)) o[String(k).trim().toLowerCase().replace(/\s+/g, "_")] = String(v).trim(); return o;
        });
      }
      if (!Object.keys(sheets).length) throw new Error(`No sheet named ${Object.keys(SHEETS).join(", ")} was found in that workbook.`);
      return { sheets, source: `${file.name} (${Object.keys(sheets).join(", ")})` };
    }
    throw new Error("Upload a .xlsx workbook, a .csv table or a .json file.");
  }
  let xlsxP = null;
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (xlsxP) return xlsxP;
    xlsxP = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = () => (window.XLSX ? res(window.XLSX) : rej(new Error("The spreadsheet reader did not load.")));
      s.onerror = () => rej(new Error("The spreadsheet reader could not be downloaded. Save the sheets as CSV and upload those instead."));
      document.head.append(s);
    });
    return xlsxP;
  }

  // ---- screen ------------------------------------------------------------------
  const tile = (n, l, color) => h("div", { class: "tile" }, h("b", { style: color ? `color:${color}` : "" }, String(n)), h("span", { class: "small" }, l));

  ICL.screens.batch = function (root, { state }) {
    root.append(screenHead(D.section("batch")));
    const b = state.batch || {};
    root.append(h("div", { class: "callout", dataset: { fb: "batch:what", fbLabel: "What batch mode is for", noNumber: "" } },
      h("strong", null, "One file, many enterprises. "),
      "Use this when the descriptions already exist — a household survey, a project's monitoring sheet, a district inventory — instead of typing each one into the wizard. ",
      "The file is checked the same way as a typed scenario, enterprise by enterprise, and anything the model would reject is listed with the sheet, the column and the row it came from. ",
      h("strong", null, "This mockup checks and compiles but does not run the model.")));

    root.append(ICL.common.disclaimer({ where: "batch", extra: "A batch multiplies this: one mistaken column applies to every row in the file. The QAQC check below finds what the model would reject, not what is simply wrong." }));

    // 1. template
    const tpl = h("div", { class: "card", dataset: { fb: "batch:template", fbLabel: "Template section" } },
      h("h2", null, "Get the template"),
      h("p", { class: "small" }, `One table per thing you are describing, joined on "enterprise_id": ${Object.keys(SHEETS).join(", ")}. Names, not codes — write "Napier grass" and "Cows, local breed", exactly as they appear in the parameter set. Unknown names are reported rather than guessed.`));
    const tplRow = h("div", { class: "control" });
    tplRow.append(h("button", { type: "button", class: "btn", onclick: () => ICL.download("icleaned-batch-template.json", JSON.stringify({ sheets: Object.fromEntries(Object.entries(SHEETS).map(([k, s]) => [k, [Object.fromEntries(s.cols.map((c) => [c, ""]))]])) }, null, 1), "application/json") }, "Download the JSON template"));
    for (const [k, spec] of Object.entries(SHEETS))
      tplRow.append(h("button", { type: "button", class: "btn-sm", onclick: () => ICL.download(`icleaned-batch-${k}.csv`, toCsv([spec.cols]), "text/csv") }, `${k}.csv`));
    tpl.append(tplRow, h("p", { class: "small" }, "A .xlsx workbook with one sheet per table works too; sheets must be named as above. Required columns: ",
      ...Object.entries(SHEETS).map(([k, s]) => h("span", { class: "chip", style: "margin:2px 4px 2px 0" }, `${k}: ${s.required.join(", ")}`))));
    root.append(tpl);

    // 2. upload
    const up = h("div", { class: "card", dataset: { fb: "batch:upload", fbLabel: "Upload section" } }, h("h2", null, "Upload the file"));
    const input = h("input", { type: "file", accept: ".xlsx,.xls,.csv,.json", "aria-label": "Batch file" });
    const status = h("div", { class: "msg" });
    const take = async (file) => {
      if (!file) return;
      status.className = "msg"; status.textContent = `Reading ${file.name}…`;
      try { const { sheets, source } = await readFile(file); load(sheets, source); }
      catch (e) { status.className = "msg err"; status.textContent = e && e.message ? e.message : String(e); }
    };
    input.addEventListener("change", () => take(input.files[0]));
    const drop = h("div", { class: "dropzone" }, h("strong", null, "Drop a file here"), h("span", { class: "small" }, "or choose one below · .xlsx · .csv · .json"));
    ["dragover", "dragenter"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove("over")));
    drop.addEventListener("drop", (e) => { e.preventDefault(); take(e.dataTransfer.files[0]); });
    up.append(drop, h("div", { class: "control" }, input,
      h("button", { type: "button", class: "btn secondary", onclick: () => load(sampleSheets(), "sample batch (12 enterprises, 3 with deliberate errors)") }, "Load a sample batch instead")),
      status,
      h("p", { class: "small" }, "Nothing leaves this browser: the file is read and checked in the page. The real app would also store the batch against your project."));
    root.append(up);

    if (!b.rows || !b.rows.length) {
      root.append(h("div", { class: "empty" }, "No batch loaded yet. Upload a file or load the sample to see the checks."));
      return;
    }

    // 3 + 4. results tabs
    const tab = b.tab || "check";
    const tabs = h("div", { class: "tabs", role: "tablist" });
    for (const [k, l] of [["check", `QAQC check (${b.rows.length})`], ["viz", "Visualise the batch"], ["export", "Download"]])

  function checkTab(root, b) {

  function openInBuilder(r) {

  function vizTab(root, b) {
    const ok = b.rows.filter((r) => r.status !== "blocked");
    root.append(h("div", { class: "callout" }, h("strong", null, "These are your inputs added up, not model results. "),

    root.append(bars("Animals per enterprise", (r) => r.head, "animals", 0));
    root.append(bars("Land per enterprise", (r) => r.area, "ha", 2));
    root.append(bars("Milk per animal a year", (r) => (r.head ? r.milk / r.head : NaN), "kg", 0));

  }

  function exportTab(root, b) {
    const report = [["# " + ICL.common.DISCLAIMER_SHORT], ["enterprise_id", "name", "status", "errors", "warnings", "assumed", "animals", "area_ha", "annual_milk_kg", "severity", "where", "problem"]];
    for (const r of b.rows) {
      const list = [...r.problems, ...r.val.errors.map((e) => ({ severity: "error", where: e.label, msg: e.msg })), ...r.val.warnings.map((e) => ({ severity: "warning", where: e.label, msg: e.msg }))];
      if (!list.length) report.push([r.id, r.name, r.status, r.errors, r.warnings, r.assumptions, r.head, r.area, Math.round(r.milk), "", "", ""]);
      for (const p of list) report.push([r.id, r.name, r.status, r.errors, r.warnings, r.assumptions, r.head, r.area, Math.round(r.milk), p.severity, p.where, p.msg]);

        h("button", { type: "button", class: "btn-sm", onclick: () => ICL.download("icleaned-batch-model-input-all.json", JSON.stringify(bundle, null, 1), "application/json") }, `Model input, everything (${bundle.enterprises.length})`),
        h("button", { type: "button", class: "btn-sm", onclick: () => ICL.download("icleaned-batch-as-uploaded.json", JSON.stringify({ sheets: b.sheets }, null, 1), "application/json") }, "The file as read")),
      h("p", { class: "small" }, "The QAQC report has one row per problem, with the sheet and column, so it can go straight back to whoever filled the sheet. The model input is one compiled study object per enterprise, in the shape the ", h("em", null, "cleaned"), " package reads, each with its assumed values listed."),

/* Results. The mockup cannot run the model, so every number here comes from a
   deliberately simple sketch calculation whose formula is shown next to it. The point
   is to test the layout, the units and the wording of the output — not the science. */
(function (ICL) {
  const { h, fmt } = ICL; const D = ICL.dict; const { screenHead } = ICL.common;

  // Sketch factors, all visible to the user. Order of magnitude only.
  const SK = {
    ch4_ef: { dairy: 117, other: 58, young: 35 },   // kg CH4 per head per year, IPCC 2019 Tier 1-ish
    gwp_ch4: 27, gwp_n2o: 273,                       // AR6 100-year
    n_ex_per_kg_lw: 0.35,                            // kg N excreted per kg live weight per year
    ef_n2o_direct: 0.01, ef_leach: 0.24, ef_n2o_leach: 0.011,
    water_per_kg_dm: 1200,                           // litres of green water per kg feed DM
    dmi_pct_lw: 0.025,                               // dry matter intake as a share of live weight per day
  };

  function sketch(state, compiled) {
    const lv = (compiled.input.livestock || []);
    const rows = lv.map((l) => {
      const n = Number(l.herd_composition) || 0;
      const bw = Number(l.body_weight) || 0;
      const desc = String(l.livetype_desc || "");
      const kind = /Cows/i.test(desc) ? "dairy" : /Calve|Calf/i.test(desc) ? "young" : "other";
      const ch4 = n * SK.ch4_ef[kind];
      const dmi = n * bw * SK.dmi_pct_lw * 365;                       // kg DM per year
      const n_ex = n * bw * SK.n_ex_per_kg_lw;                        // kg N per year
      const n2o_direct = n_ex * SK.ef_n2o_direct * 44 / 28;
      const n2o_leach = n_ex * SK.ef_leach * SK.ef_n2o_leach * 44 / 28;
      const milk = (Number(l.annual_milk) || 0) * n;
      const meat = (Number(l.annual_growth) || 0) * n * (Number(l.carcass_fraction) || 0.5);
      return { desc, n, kind, ch4, dmi, n_ex, n2o: n2o_direct + n2o_leach, milk, meat };
    });
    const tot = (k) => rows.reduce((t, r) => t + r[k], 0);
    const area = state.plots.reduce((t, p) => t + (Number(p.plot_area_ha) || 0), 0);
    const dm = tot("dmi");
    const ghg_ch4 = tot("ch4") * SK.gwp_ch4;
    const ghg_n2o = tot("n2o") * SK.gwp_n2o;
    const ghg = ghg_ch4 + ghg_n2o;                                    // kg CO2e per year
    const milk = tot("milk"), meat = tot("meat");
    // feed nitrogen removed by the crops, against manure N returned
    const n_manure_onfarm = rows.reduce((t, r) => t + r.n_ex, 0) * (Number((compiled.input.livestock[0] || {}).manure_onfarm_fraction) || 0.7);
    const fert_n = (compiled.input.feed_items || []).reduce((t, f) => t + (Number(f.n_fertilizer) || 0), 0);
    const n_removed = dm * 0.015;                                     // 1.5 % N in feed dry matter
    return {
      rows, area, dm, ghg, ghg_ch4, ghg_n2o, milk, meat,
      water: dm * SK.water_per_kg_dm / 1000,                          // m3 per year
      land_per_animal: rows.reduce((t, r) => t + r.n, 0) ? area / rows.reduce((t, r) => t + r.n, 0) : null,
      ghg_per_kg_milk: milk ? ghg / milk : null,
      ghg_per_ha: area ? ghg / area : null,
      n_balance: n_manure_onfarm + fert_n - n_removed,
      n_in: n_manure_onfarm + fert_n, n_out: n_removed,
      soil_loss: area ? area * 12 : null,                             // t per year, placeholder rate
      feed_gap: area && dm ? (dm / 1000) / area : null,               // t DM per ha demanded
    };
  }

  const tile = (v, unit, label, note, color) => h("div", { class: "rtile" },
    h("b", { style: color ? `color:${color}` : "" }, v), h("span", { class: "u" }, unit),
    h("span", { class: "l" }, label), note ? h("span", { class: "small" }, note) : null);

  ICL.screens.results = function (root, { state, val, compiled }) {
    root.append(screenHead(D.section("results")));

    root.append(h("div", { class: "callout disclaimer", dataset: { fb: "results:sketch", fbLabel: "Sketch numbers notice", noNumber: "" } },
      h("strong", null, "These numbers are a sketch, not the model. "),
      "This mockup does not run ", h("em", null, "cleaned"), ". Every figure below is a deliberately crude calculation from your inputs — the formula is printed under each one — so that the layout, the units and the wording can be tested with real-feeling output. ",
      "In the real app this screen shows the model's own results. Do not quote anything here."));

    if (val.errors.length) root.append(h("div", { class: "callout warn" },
      `${val.errors.length} thing${val.errors.length === 1 ? "" : "s"} would stop a real run. `,

    root.append(tb);

    if (tab === "summary") {
      root.append(h("div", { class: "rtiles", dataset: { fb: "results:headline", fbLabel: "Headline indicators" } },

        tile(s.ghg_per_kg_milk != null ? fmt(s.ghg_per_kg_milk, 2) : "—", "kg CO₂e / kg milk", "Emission intensity", "the number most often compared"),
        tile(fmt(s.dm / 1000, 1), "t DM / year", "Feed eaten", "dry matter across the herd"),

    if (tab === "ghg") {

        tile(fmt(s.ghg_ch4 / 1000, 1), "t CO₂e", "Methane (enteric)", `${fmt(s.ghg_ch4 / s.ghg * 100, 0)}% of the total`),
        tile(fmt(s.ghg_n2o / 1000, 1), "t CO₂e", "Nitrous oxide (manure)", `${fmt(s.ghg_n2o / s.ghg * 100, 0)}% of the total`),
        tile(fmt(s.ghg / 1000, 1), "t CO₂e", "Total", "per year")));
      const card = h("div", { class: "card", dataset: { fb: "results:ghg_by_group", fbLabel: "Emissions by animal group" } }, h("h2", null, "Where the emissions come from"));
      const max = Math.max(...s.rows.map((r) => r.ch4 * SK.gwp_ch4 + r.n2o * SK.gwp_n2o), 1);
      for (const r of s.rows) {
        const v = r.ch4 * SK.gwp_ch4 + r.n2o * SK.gwp_n2o;
        card.append(h("div", { class: "distrow" }, h("span", { class: "dl" }, D.livetypeLabel(r.desc) + ` (${fmt(r.n, 0)})`),
          h("span", { class: "db" }, h("span", { class: "dbf", style: `width:${Math.max(1, v / max * 100)}%` })),
          h("span", { class: "dv" }, fmt(v / 1000, 1) + " t")));
      }
      root.append(card, formulaBox("ghg"));
    }

    if (tab === "land") {
      root.append(h("div", { class: "rtiles" },
        tile(s.area ? fmt(s.area, 2) : "—", "ha", "Land described", null),
        tile(s.feed_gap != null ? fmt(s.feed_gap, 1) : "—", "t DM / ha", "Feed demanded per hectare", "compare with what your plots yield"),
        tile(s.land_per_animal != null ? fmt(s.land_per_animal, 2) : "—", "ha / animal", "Land per animal", null)));
      const card = h("div", { class: "card" }, h("h2", null, ICL.t("Feed by {plot}")));
      const rows = state.plots.map((p) => {

/* Why iCLEANED: the question it answers, what a partner gets, use cases, and an
   honest comparison with the tools people already use. Facts about other tools come
   from their own manuals, read in September 2026; anything inferred is marked. */
(function (ICL) {
  const { h } = ICL; const D = ICL.dict; const { screenHead } = ICL.common;

  const INDICATORS = [
    ["Greenhouse gases", "Enteric methane, manure methane and nitrous oxide, and the emissions of the feed, following IPCC 2019 Tier 2 where the data allow it."],
    ["Land", "How much land the herd's feed actually occupies, including land elsewhere when feed is bought in, and the productivity of that land."],
    ["Water", "The water used to grow the feed, which in rainfed systems is most of the water a herd is responsible for."],
    ["Soil", "Erosion from the land that grows the feed, from slope, cover and practice."],
    ["Nitrogen", "What the feed takes off the land against what the manure and fertiliser put back — the balance that decides whether the system is being mined."],
  ];

  const OFFER = [
    ["The model, open", "The <em>cleaned</em> R package is open source: the equations, the IPCC tables and the regional data can be read, cited, forked and run without us. A partner is never locked to a hosted service or a licence."],
    ["A hosted entry point", "This app, for people who will not use R: describe an enterprise, check it, run it, compare scenarios, export the numbers."],
    ["Regional parameter sets", "The defaults that make a tool usable somewhere new — animal weights, feed quality, yields, soil factors. We build one with a partner from their own survey or station data, and it is shipped as a named, versioned, citable set that anyone in that region can then use."],
    ["Batch assessment of existing data", "Survey and monitoring data usually already describe hundreds of enterprises. The batch route checks and runs them from a spreadsheet, with a QAQC report that names the sheet, column and row of every problem, so the effort goes into fixing data rather than re-keying it."],
    ["Training and facilitation", "Workshops for enumerators, advisers and analysts, with materials: the run sheet, the field form, the glossary, and the feedback route back into this queue."],
    ["Co-developed analysis", "Joint work on a specific question — an inventory, a project baseline, an intervention comparison — rather than handing over a tool and leaving."],
  ];

  const PARTNERS = [
    ["A national ministry or statistics office", "Needs a defensible inventory number and a method that survives review.", "A national or sub-national herd described once, with the IPCC labels and the assumptions listed; batch runs from existing survey rounds; a parameter set that becomes the country's reference."],
    ["A research programme or university", "Needs transparency, repeatability and something to cite.", "The open package, the versioned parameter set, the compiled study object for every scenario, and per-cell provenance for every value that went into it."],

  const SEGMENTS = [
    {
      name: "Research networks",
